<!DOCTYPE html>
<html>
<body style="font-family:Arial,sans-serif;max-width:600px;margin:0 auto;padding:24px;color:#1a1a1a;">
  <h2 style="margin-bottom:8px;">Verify your email</h2>
  <p>Hi {{.Name}},</p>
  <p>Thanks for signing up for Preuvio. Click the button below to verify your email address.</p>
  <p><a href="{{.Link}}" style="display:inline-block;background:#111827;color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;">Verify email</a></p>
  <p style="color:#6b7280;font-size:14px;">Or paste this link in your browser:<br>{{.Link}}</p>
  <p style="color:#6b7280;font-size:14px;">This link expires in {{.ExpiresIn}}.</p>
</body>
</html>
